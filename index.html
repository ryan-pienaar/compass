<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass: put first things first</title>
    <meta name="description" content="A local, principle-centered planner for Quadrant II: mission, roles, weekly planning and daily adapting." />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110f0c" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint (see src/components/theme.tsx).
      (function () {
        try {
          var t = localStorage.getItem("compass.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
